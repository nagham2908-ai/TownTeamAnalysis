<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oracle Fusion HCM Workforce Compensation — Requirements Questionnaire</title>
<style>
:root{
  --navy:#0b1a63;
  --navy-deep:#00007c;
  --blue:#225fac;
  --blue-light:#4a7fd4;
  --blue-pale:#eef1fb;
  --bg:#f4f6fb;
  --card:#ffffff;
  --border:#dfe3ee;
  --text:#1c2230;
  --text-mut:#5a6178;
  --danger:#c0392b;
  --danger-bg:#fdecea;
  --ok:#1e8e5a;
  --ok-bg:#e9f8f0;
  --radius:10px;
  --shadow:0 1px 3px rgba(11,26,99,0.08), 0 1px 2px rgba(11,26,99,0.06);
  --shadow-md:0 4px 16px rgba(11,26,99,0.10);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  line-height:1.5;
  font-size:14px;
}
#app{min-height:100vh;display:flex;flex-direction:column;}

/* ===== Header ===== */
header.app-header{
  background:linear-gradient(135deg,var(--navy-deep) 0%,var(--navy) 55%,var(--blue) 100%);
  color:#fff;
  padding:18px 28px;
  display:flex;align-items:center;justify-content:space-between;
  flex-wrap:wrap;gap:12px;
  box-shadow:var(--shadow-md);
}
.brand{display:flex;align-items:center;gap:14px;}
.brand-logo{display:flex;align-items:center;gap:8px;}
.brand-logo svg{display:block;}
.brand-text{}
.brand-text h1{font-size:16px;margin:0 0 2px;font-weight:700;letter-spacing:.2px;}
.brand-text p{margin:0;font-size:12px;opacity:.85;}
.header-actions{display:flex;gap:8px;flex-wrap:wrap;}

/* ===== Buttons ===== */
button{font-family:inherit;font-size:13px;cursor:pointer;border-radius:7px;border:1px solid transparent;padding:9px 16px;transition:background .15s,border-color .15s,color .15s;}
.btn-primary{background:var(--blue);color:#fff;border-color:var(--blue);font-weight:600;}
.btn-primary:hover{background:var(--navy);}
.btn-primary:disabled{opacity:.5;cursor:not-allowed;}
.btn-secondary{background:#fff;color:var(--navy);border-color:var(--border);}
.btn-secondary:hover{background:var(--blue-pale);}
.btn-ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,0.5);}
.btn-ghost:hover{background:rgba(255,255,255,0.15);}
.btn-danger{background:#fff;color:var(--danger);border-color:#f1c4bd;}
.btn-danger:hover{background:var(--danger-bg);}
.btn-sm{padding:5px 10px;font-size:12px;border-radius:6px;}
.btn-block{width:100%;}
.icon-btn{padding:5px 8px;font-size:12px;}

/* ===== Layout ===== */
.layout{display:flex;flex:1;min-height:0;}
nav.side-nav{
  width:260px;flex-shrink:0;background:#fff;border-right:1px solid var(--border);
  padding:16px 0;overflow-y:auto;
}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:9px 18px;font-size:12.5px;color:var(--text-mut);
  cursor:pointer;border-left:3px solid transparent;
}
.nav-item:hover{background:var(--blue-pale);}
.nav-item.active{color:var(--navy);font-weight:700;border-left-color:var(--blue);background:var(--blue-pale);}
.nav-item.done .nav-dot{background:var(--ok);border-color:var(--ok);}
.nav-item.done .nav-dot::after{content:"✓";color:#fff;font-size:9px;}
.nav-dot{width:16px;height:16px;border-radius:50%;border:2px solid #c7cce0;flex-shrink:0;display:flex;align-items:center;justify-content:center;}

main.content{flex:1;overflow-y:auto;padding:26px 30px 90px;}
.content-inner{max-width:920px;margin:0 auto;}

/* ===== Progress ===== */
.progress-wrap{padding:10px 30px 0;max-width:920px;margin:0 auto;width:100%;}
.progress-bar-track{height:7px;background:var(--border);border-radius:5px;overflow:hidden;}
.progress-bar-fill{height:100%;background:linear-gradient(90deg,var(--blue),var(--blue-light));border-radius:5px;transition:width .25s;}
.progress-label{font-size:12px;color:var(--text-mut);margin:6px 0 0;display:flex;justify-content:space-between;}

/* ===== Section ===== */
.section-header{margin-bottom:18px;}
.section-header h2{font-size:20px;margin:0 0 4px;color:var(--navy);font-weight:700;}
.section-header p.helper{margin:0;color:var(--text-mut);font-size:13px;}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;margin-bottom:16px;box-shadow:var(--shadow);}
.card h3{font-size:14.5px;margin:0 0 12px;color:var(--navy);font-weight:700;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;}
.card h3 .tag{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;background:var(--blue-pale);color:var(--blue);padding:3px 8px;border-radius:20px;}
.card .helper-text{font-size:12px;color:var(--text-mut);margin:-6px 0 12px;}
.subcard{border:1px dashed var(--border);border-radius:8px;padding:14px 16px;margin-top:10px;background:#fbfcfe;}

/* ===== Form fields ===== */
.field{margin-bottom:14px;}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--text);margin-bottom:5px;}
.field label .req{color:var(--danger);}
.field .field-help{font-size:11.5px;color:var(--text-mut);margin-top:4px;}
.row{display:flex;gap:14px;flex-wrap:wrap;}
.row > .field{flex:1 1 220px;}
input[type=text],input[type=email],input[type=number],input[type=date],textarea,select{
  width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:7px;font-size:13px;font-family:inherit;background:#fff;color:var(--text);
}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(34,95,172,0.12);}
textarea{resize:vertical;min-height:64px;}
input.invalid,select.invalid{border-color:var(--danger);}
.error-msg{color:var(--danger);font-size:11.5px;margin-top:4px;}

/* Yes/No pill toggle */
.yn-toggle{display:inline-flex;border:1px solid var(--border);border-radius:20px;overflow:hidden;}
.yn-toggle button{border:none;border-radius:0;padding:6px 18px;background:#fff;color:var(--text-mut);font-weight:600;font-size:12.5px;}
.yn-toggle button.active-yes{background:var(--ok-bg);color:var(--ok);}
.yn-toggle button.active-no{background:var(--danger-bg);color:var(--danger);}
.yn-toggle button:not(:last-child){border-right:1px solid var(--border);}

.use-common-box{display:flex;align-items:center;justify-content:space-between;background:var(--blue-pale);border-radius:8px;padding:10px 14px;margin-bottom:14px;flex-wrap:wrap;gap:8px;}
.use-common-box .lbl{font-size:12.5px;font-weight:600;color:var(--navy);}

/* multiselect chips */
.chip-select{display:flex;flex-wrap:wrap;gap:6px;}
.chip{padding:5px 12px;border-radius:16px;border:1px solid var(--border);font-size:12px;cursor:pointer;background:#fff;color:var(--text-mut);user-select:none;}
.chip.selected{background:var(--blue);color:#fff;border-color:var(--blue);}

/* ===== Tables / Matrix ===== */
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:8px;}
table.matrix{border-collapse:collapse;width:100%;min-width:640px;font-size:12.5px;}
table.matrix th{background:var(--blue-pale);color:var(--navy);text-align:left;padding:8px 10px;font-weight:700;border-bottom:1px solid var(--border);white-space:nowrap;}
table.matrix td{padding:6px 8px;border-bottom:1px solid var(--border);vertical-align:top;}
table.matrix td input,table.matrix td select{padding:6px 7px;font-size:12.5px;min-width:110px;}
table.matrix tr:last-child td{border-bottom:none;}
.row-actions{display:flex;gap:4px;white-space:nowrap;}
.matrix-toolbar{padding:10px;display:flex;justify-content:flex-end;background:#fbfcfe;border-top:1px solid var(--border);}
@media (max-width:760px){
  table.matrix, table.matrix thead, table.matrix tbody, table.matrix th, table.matrix td, table.matrix tr{display:block;}
  table.matrix thead{display:none;}
  table.matrix tr{border-bottom:2px solid var(--border);padding:10px 0;}
  table.matrix td{border:none;padding:5px 10px;}
  table.matrix td::before{content:attr(data-label);display:block;font-size:10.5px;font-weight:700;color:var(--text-mut);text-transform:uppercase;margin-bottom:2px;}
}

/* plan chip in headers */
.plan-chip{display:inline-flex;align-items:center;gap:6px;background:var(--navy);color:#fff;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:700;}
.plan-chip .id{opacity:.7;font-weight:500;font-size:10.5px;}

/* Footer nav */
footer.wizard-footer{
  position:sticky;bottom:0;background:#fff;border-top:1px solid var(--border);
  padding:14px 30px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;
  box-shadow:0 -2px 10px rgba(11,26,99,0.06);
}
.footer-right{display:flex;gap:8px;flex-wrap:wrap;}
.save-indicator{font-size:11.5px;color:var(--text-mut);display:flex;align-items:center;gap:5px;}
.save-indicator .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);}

.toast{position:fixed;bottom:80px;right:24px;background:var(--navy);color:#fff;padding:10px 18px;border-radius:8px;font-size:12.5px;box-shadow:var(--shadow-md);z-index:999;opacity:0;transform:translateY(8px);transition:opacity .2s,transform .2s;pointer-events:none;}
.toast.show{opacity:1;transform:translateY(0);}

.banner-err{background:var(--danger-bg);border:1px solid #f1c4bd;color:var(--danger);padding:10px 14px;border-radius:8px;font-size:12.5px;margin-bottom:16px;}
.banner-info{background:var(--blue-pale);border:1px solid #cfd9f5;color:var(--navy);padding:10px 14px;border-radius:8px;font-size:12.5px;margin-bottom:16px;}

.empty-state{text-align:center;padding:40px 20px;color:var(--text-mut);}
.empty-state .big{font-size:38px;margin-bottom:8px;}

.review-block{margin-bottom:22px;}
.review-block h3{color:var(--navy);font-size:15px;border-bottom:2px solid var(--blue-pale);padding-bottom:6px;margin-bottom:10px;}
.review-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 20px;font-size:12.5px;}
@media (max-width:640px){.review-grid{grid-template-columns:1fr;}}
.review-item{padding:5px 0;border-bottom:1px dotted var(--border);}
.review-item .k{color:var(--text-mut);font-size:11px;text-transform:uppercase;letter-spacing:.3px;}
.review-item .v{font-weight:600;}
.plan-review-card{border:1px solid var(--border);border-radius:10px;margin-bottom:14px;overflow:hidden;}
.plan-review-head{background:var(--navy);color:#fff;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;}
.plan-review-body{padding:14px 16px;}
.sub-review{margin-bottom:14px;}
.sub-review h4{font-size:12.5px;color:var(--blue);margin:0 0 6px;text-transform:uppercase;letter-spacing:.3px;display:flex;justify-content:space-between;align-items:center;}

.hamburger{display:none;background:transparent;border:1px solid rgba(255,255,255,.5);color:#fff;padding:7px 10px;}
@media (max-width:900px){
  nav.side-nav{position:fixed;top:0;left:0;bottom:0;z-index:50;box-shadow:var(--shadow-md);display:none;}
  nav.side-nav.mobile-open{display:block;}
  .hamburger{display:inline-block;}
  main.content{padding:18px 14px 90px;}
  .progress-wrap{padding:10px 14px 0;}
  footer.wizard-footer{padding:12px 14px;}
}

.success-wrap{max-width:560px;margin:60px auto;text-align:center;}
.success-wrap .check{width:70px;height:70px;border-radius:50%;background:var(--ok-bg);color:var(--ok);display:flex;align-items:center;justify-content:center;font-size:34px;margin:0 auto 18px;}
.ref-box{background:var(--blue-pale);border-radius:10px;padding:18px;margin:22px 0;text-align:left;}
.ref-box .ref-code{font-family:monospace;font-size:20px;font-weight:700;color:var(--navy);letter-spacing:1px;}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   ORACLE FUSION HCM WORKFORCE COMPENSATION — REQUIREMENTS QUESTIONNAIRE
   Single-file interactive application.
   ============================================================ */

/* ---------------------------------------------------------
   0. CONSTANTS / OPTION LISTS
--------------------------------------------------------- */
const MODULE_CLASS = ["Workforce Compensation (WFC)","Payroll (Automatic Formula)","Individual Compensation (Ad-hoc)","Not Yet Confirmed"];
const PAYROLL_DATA_SOURCE = ["Live System Feed (e.g. sales/KPI system)","OTBI Extract","Manual Upload / Spreadsheet","Other"];
const INDIV_COMP_TRIGGER = ["Manager Request","HR-Initiated","Employee Nomination","Other"];
const COMP_TYPES = ["Merit Increase","Bonus","Promotion","Salary Adjustment","Allowance","Commission","Stock / Equity","Other"];
const FREQUENCIES = ["Annual","Semi-Annual","Quarterly","Monthly","Ad Hoc / As Required","Other"];
const CYCLE_TYPES = ["Merit","Bonus","Promotion","Adjustment","Other"];
const CURRENCIES = ["EGP","USD","EUR","Other"];
const SALARY_SOURCES = ["Current Salary","Annual Salary","Salary Basis","Salary Component","Other"];
const PERF_SOURCES = ["Oracle Performance Management","Manual Rating","Imported Rating","Other"];
const RATING_PERIODS = ["Annual","Semi-Annual","Quarterly","Other"];
const CALC_BASIS = ["Current Salary","Annual Salary","Salary Range","Compa-Ratio","Performance Rating","Fixed Amount","Other"];
const CALC_METHOD = ["Percentage","Fixed Amount","Formula","Guideline","Manager Input","Imported Amount"];
const GUIDELINE_TYPE = ["Percentage","Amount","Matrix","Range","Formula","No Guideline"];
const COMPA_SOURCE = ["Oracle Salary Range","Core HR","Calculated","Imported","Other"];
const BUDGET_TYPE = ["Amount","Percentage"];
const BUDGET_LEVEL = ["Company","Legal Employer","Business Unit","Department","Manager","Other"];
const BUDGET_OWNER = ["HR","Finance","Compensation","Manager","Other"];
const ALLOCATION_METHOD = ["Automatic","Manual","Imported"];
const APPROVER_ROLE = ["Line Manager","Manager's Manager","Department Manager","HR","HRBP","HR Manager","HR Director","Finance","Finance Manager","CFO","CEO","Compensation Manager","Specific Person","Other"];
const APPROVAL_BASED_ON = ["Employee","Department","Business Unit","Legal Employer","Compensation Amount","Percentage Increase","Budget","Job","Grade","Manager Hierarchy","Other"];
const CONDITION_OPS = ["Equal To","Not Equal To","Less Than","Less Than or Equal To","Greater Than","Greater Than or Equal To","Between","All"];
const WHAT_GENERATED = ["Salary Change","Recurring Element","One-Time Element","Bonus Payment","Allowance","Commission","Other"];
const PROCESSING_METHOD = ["Automatic","Manual","Imported"];
const PAYROLL_ACTION = ["Update Salary","Create Element","One-Time Payment","Other"];
const GEN_METHOD = ["Manager Enters Amount","Manager Enters Percentage","System Calculates Percentage","Guideline","Performance","Compa-Ratio","Formula","Imported Amount","Fixed Amount","Other"];
const GEN_SOURCE = ["Current Salary","Annual Salary","Performance","Compa-Ratio","Budget","External File","Other"];
const PAYMENT_TYPE = ["Salary Increase","Recurring Allowance","One-Time Payment","Bonus","Commission","Other"];
const PRORATION_BASIS = ["Hire Date","Seniority Date","Assignment Date","Promotion Date","Termination Date","Leave","Other"];
const PRORATION_METHOD = ["Days","Months","Percentage","Formula","Other"];
const WORKSHEET_DISPLAY_BY = ["Manager","Department","Business Unit","Legal Employer","Other"];
const WORKSHEET_FIELDS = ["Employee Name","Employee Number","Job","Grade","Department","Location","Manager","Current Salary","Salary Range","Compa-Ratio","Performance Rating","Proposed %","Proposed Amount","New Salary","Bonus Amount","Comments"];
const FINAL_BY = ["Compensation Team","HR","Payroll","Finance","Other"];
const REOPEN_WHO = ["Compensation Team","HR","HR Director","System Administrator","Other"];
const SECURITY_ROLES = ["HR","Compensation Team","Managers","Finance","Payroll","Employees","Senior Management","Other"];
const REPORTS_LIST = ["Compensation Summary","Manager Worksheet","Budget vs Actual","Employee Compensation Statement","Salary Increase Report","Bonus Payment Report","Payroll Input","Approval Status","Compensation by Department","Compensation by Grade","Other"];
const AUDIENCE = ["HR","Managers","Finance","Payroll","Employees","Management","Other"];
const REQUIRED_FIELDS = ["Employee","Employee Number","Salary","Increase %","Increase Amount","Bonus","Rating","Compa-Ratio","Budget","Approval","Department","Grade","Other"];
const EXPORT_FORMATS = ["Excel","CSV","PDF","Other"];
const DELIVERY_METHODS = ["Employee Self-Service","Email","PDF","Other"];
const CORE_HR_ATTRS = ["Legal Employer","Business Unit","Department","Location","Grade","Job","Position","Employment Category","Assignment Category","Hire Date","Seniority Date","Assignment Status","Manager","Salary Basis","Salary Component","Current Salary"];
const USED_FOR = ["Eligibility","Calculation","Guideline","Proration","Approval","Worksheet Display","Salary Update","Final Processing"];
const OPERATORS = ["Equal To","Not Equal To","In List","Between","Greater Than","Less Than","Contains"];
const OTHER_AREAS = ["Eligibility","Salary","Performance","Guidelines","Budget","Approval","Payroll","Proration","Security","Communication","Integration","Reporting","Other"];
const EXCEPTION_TYPES = ["Cycle Start Date Change","Cycle End Date Change","Effective Date Change","Delayed Processing","Early Processing","Reopened Cycle","Other"];

/* ---------------------------------------------------------
   1. STATE
--------------------------------------------------------- */
const STORAGE_KEY = "wfc_questionnaire_v1";

function freshState(){
  return {
    currentStep: 0,
    respondent:{name:"",position:"",department:"",email:"",company:"",date:""},
    plans:[],
    calendars:[],
    calendarApproach:"", // 1,2,3
    calendarOverride:{any:"", planId:"", calendar:{}},
    calendarReopen:{allowed:"",who:"",whoOther:"",circumstances:"",additionalApproval:""},
    calendarExceptions:{has:"",rows:[]},
    shared:{
      currency:{same:"",value:"",other:""},
      employeeRules:{same:"",active:"",onLeave:"",terminated:"",suspended:"",newJoiners:""},
      minService:{same:"",value:"",unit:"",dateBasis:""},
      salarySource:{same:"",source:"",other:"",component:""},
      performance:{same:"",source:"",other:"",ratingModel:"",ratingPeriod:""},
      approval:{same:"",levels:[]},
      payroll:{same:"",processDesc:""},
      managerWorksheet:{same:"",displayBy:"",displayByOther:"",canEditPct:"",canEditAmount:"",canAddComments:"",canAddEmployees:"",canBelowGuideline:"",canAboveGuideline:"",fields:[]}
    },
    finalProcessingCommon:{same:"",by:"",byOther:"",reviewBy:"",reviewByOther:"",hrReview:"",reopen:"",effectiveDateConfirm:"",salaryAutoUpdate:"",payrollAutoTransfer:""},
    finalProcessingPlans:[], // rows when not common
    security:{same:"",viewAccess:[],editAccess:[],hierarchy:"",employeeSeeOwn:"",rows:[]},
    reportingCommon:{same:"",rows:[]},
    reportingPlans:[], // per plan rows when not common
    communication:{same:"",statementRequired:"",delivery:"",timing:"",content:""},
    communicationPlans:[],
    otherRequirements:[],
    submitted:false,
    submissionRef:"",
    submissionDate:""
  };
}
let state = loadState();

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){ const parsed = JSON.parse(raw); return Object.assign(freshState(), parsed); }
  }catch(e){}
  return freshState();
}
let mobileNavOpen=false;
let saveTimer=null;
function persist(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); showToast("Draft saved"); }catch(e){}
  },350);
}
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),1600);
}

/* ---------------------------------------------------------
   2. GENERIC DOM HELPERS
--------------------------------------------------------- */
function h(tag, attrs={}, children=[]){
  const el = document.createElement(tag);
  for(const k in attrs){
    if(k==="class") el.className=attrs[k];
    else if(k==="html") el.innerHTML=attrs[k];
    else if(k.startsWith("on")) el.addEventListener(k.slice(2).toLowerCase(), attrs[k]);
    else if(k==="text") el.textContent=attrs[k];
    else el.setAttribute(k, attrs[k]);
  }
  (Array.isArray(children)?children:[children]).forEach(c=>{
    if(c==null) return;
    if(typeof c==="string") el.appendChild(document.createTextNode(c));
    else el.appendChild(c);
  });
  return el;
}
function uid(prefix){ return prefix + "-" + Math.random().toString(36).slice(2,8); }
function nextPlanId(){
  let n = state.plans.length+1;
  let id = "PLAN-"+String(n).padStart(3,"0");
  while(state.plans.some(p=>p.id===id)){ n++; id="PLAN-"+String(n).padStart(3,"0"); }
  return id;
}
function nextCalId(){
  let n = state.calendars.length+1;
  let id = "CAL-"+String(n).padStart(3,"0");
  while(state.calendars.some(c=>c.id===id)){ n++; id="CAL-"+String(n).padStart(3,"0"); }
  return id;
}

function field(labelText, inputEl, opts={}){
  const lbl = h('label',{},[labelText, opts.required?h('span',{class:'req',text:' *'}):null]);
  const wrap = h('div',{class:'field'},[lbl, inputEl]);
  if(opts.help) wrap.appendChild(h('div',{class:'field-help',text:opts.help}));
  if(opts.errorId) wrap.appendChild(h('div',{class:'error-msg',id:opts.errorId}));
  return wrap;
}
function textInput(value, onChange, opts={}){
  const inp = h('input',{type:opts.type||'text', value:value||''});
  if(opts.placeholder) inp.placeholder=opts.placeholder;
  inp.addEventListener('input', ()=>{ onChange(inp.value); persist(); });
  return inp;
}
function numberInput(value, onChange){
  const inp = h('input',{type:'number', value:(value===undefined||value===null)?'':value});
  inp.addEventListener('input', ()=>{ onChange(inp.value); persist(); });
  return inp;
}
function dateInput(value, onChange){
  const inp = h('input',{type:'date', value:value||''});
  inp.addEventListener('change', ()=>{ onChange(inp.value); persist(); });
  return inp;
}
function textareaInput(value, onChange, rows){
  const t = h('textarea',{}, []);
  t.value = value||'';
  if(rows) t.rows=rows;
  t.addEventListener('input', ()=>{ onChange(t.value); persist(); });
  return t;
}
function selectInput(value, options, onChange, placeholder){
  const sel = h('select',{});
  if(placeholder) sel.appendChild(h('option',{value:'', text:placeholder}));
  options.forEach(o=> sel.appendChild(h('option',{value:o, text:o})));
  sel.value = value||'';
  sel.addEventListener('change', ()=>{ onChange(sel.value); persist(); render(); });
  return sel;
}
function yesNo(value, onChange, labels){
  labels = labels || ['Yes','No'];
  const wrap = h('div',{class:'yn-toggle'});
  const yBtn = h('button',{type:'button', text:labels[0]});
  const nBtn = h('button',{type:'button', text:labels[1]});
  function paint(){
    yBtn.className = value==='Yes'?'active-yes':'';
    nBtn.className = value==='No'?'active-no':'';
  }
  yBtn.addEventListener('click', ()=>{ value='Yes'; onChange('Yes'); persist(); render(); });
  nBtn.addEventListener('click', ()=>{ value='No'; onChange('No'); persist(); render(); });
  paint();
  wrap.appendChild(yBtn); wrap.appendChild(nBtn);
  return wrap;
}
function chipMultiSelect(values, options, onChange){
  values = values||[];
  const wrap = h('div',{class:'chip-select'});
  options.forEach(opt=>{
    const chip = h('div',{class:'chip'+(values.includes(opt)?' selected':''), text:opt});
    chip.addEventListener('click', ()=>{
      const idx = values.indexOf(opt);
      if(idx>-1) values.splice(idx,1); else values.push(opt);
      onChange(values); persist(); render();
    });
    wrap.appendChild(chip);
  });
  const addChip = h('div',{class:'chip', style:'border-style:dashed;font-weight:700;', text:'+ Add field'});
  addChip.addEventListener('click', ()=>{
    const val = prompt('Name of the new field to add:');
    if(val && val.trim()){
      const trimmed = val.trim();
      if(!options.includes(trimmed)) options.push(trimmed);
      if(!values.includes(trimmed)) values.push(trimmed);
      onChange(values); persist(); render();
    }
  });
  wrap.appendChild(addChip);
  return wrap;
}

/* Simple file-import control: reads the file client-side and stores name + data URL
   on the given object under `key`, so it travels with the JSON/CSV export. */
function fileImportField(obj, key, accept){
  const wrap = h('div',{});
  const inp = h('input',{type:'file'});
  if(accept) inp.setAttribute('accept', accept);
  const status = h('div',{class:'field-help', text: obj[key] && obj[key].name ? ('Uploaded: '+obj[key].name) : 'No file uploaded yet.'});
  inp.addEventListener('change', ()=>{
    const f = inp.files[0];
    if(!f) return;
    const reader = new FileReader();
    reader.onload = ()=>{
      obj[key] = {name:f.name, dataUrl:reader.result};
      status.textContent = 'Uploaded: '+f.name;
      persist();
    };
    reader.readAsDataURL(f);
  });
  wrap.appendChild(inp);
  wrap.appendChild(status);
  return wrap;
}

/* Generic matrix (dynamic table) renderer
   columns: [{key,label,type:'text'|'select'|'date'|'number'|'textarea', options:[...] }]
*/
function renderMatrix(rows, columns, opts={}){
  const wrap = h('div',{class:'table-wrap'});
  const table = h('table',{class:'matrix'});
  const thead = h('thead',{});
  const trh = h('tr',{});
  columns.forEach(c=> trh.appendChild(h('th',{text:c.label})));
  trh.appendChild(h('th',{text:'Actions'}));
  thead.appendChild(trh);
  table.appendChild(thead);
  const tbody = h('tbody',{});
  rows.forEach((row,idx)=>{
    const tr = h('tr',{});
    columns.forEach(c=>{
      const td = h('td',{'data-label':c.label});
      let inp;
      if(c.type==='select'){
        inp = selectInputRaw(row[c.key], c.options, v=>{ row[c.key]=v; persist(); });
      } else if(c.type==='date'){
        inp = h('input',{type:'date', value:row[c.key]||''});
        inp.addEventListener('change', ()=>{ row[c.key]=inp.value; persist(); });
      } else if(c.type==='number'){
        inp = h('input',{type:'number', value:row[c.key]||''});
        inp.addEventListener('input', ()=>{ row[c.key]=inp.value; persist(); });
      } else if(c.type==='textarea'){
        inp = h('input',{type:'text', value:row[c.key]||''});
        inp.addEventListener('input', ()=>{ row[c.key]=inp.value; persist(); });
      } else {
        inp = h('input',{type:'text', value:row[c.key]||''});
        inp.addEventListener('input', ()=>{ row[c.key]=inp.value; persist(); });
      }
      td.appendChild(inp);
      tr.appendChild(td);
    });
    const actTd = h('td',{'data-label':'Actions'});
    const actions = h('div',{class:'row-actions'});
    const dup = h('button',{class:'btn-secondary icon-btn', type:'button', title:'Duplicate', text:'⧉'});
    dup.addEventListener('click', ()=>{ rows.splice(idx+1,0, JSON.parse(JSON.stringify(row))); persist(); render(); });
    const del = h('button',{class:'btn-danger icon-btn', type:'button', title:'Delete', text:'✕'});
    del.addEventListener('click', ()=>{ rows.splice(idx,1); persist(); render(); });
    actions.appendChild(dup); actions.appendChild(del);
    actTd.appendChild(actions);
    tr.appendChild(actTd);
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  wrap.appendChild(table);
  const toolbar = h('div',{class:'matrix-toolbar'});
  const addBtn = h('button',{class:'btn-secondary btn-sm', type:'button', text:'+ Add Row'});
  addBtn.addEventListener('click', ()=>{
    const newRow={};
    columns.forEach(c=> newRow[c.key]='');
    if(opts.onAdd) opts.onAdd(newRow);
    rows.push(newRow); persist(); render();
  });
  toolbar.appendChild(addBtn);
  wrap.appendChild(toolbar);
  if(rows.length===0){
    const empty = h('div',{class:'empty-state'},[h('div',{text:'No rows yet. Click "Add Row" to begin.'})]);
    wrap.insertBefore(empty, toolbar);
  }
  return wrap;
}
function selectInputRaw(value, options, onChange){
  const sel = h('select',{});
  sel.appendChild(h('option',{value:'', text:'Select...'}));
  options.forEach(o=> sel.appendChild(h('option',{value:o, text:o})));
  sel.value = value||'';
  sel.addEventListener('change', ()=>{ onChange(sel.value); });
  return sel;
}

/* Generic field-schema form renderer for repeated per-plan config objects */
function renderSchemaForm(container, obj, schema){
  schema.forEach(f=>{
    if(f.showIf && !f.showIf(obj)) return;
    let inputEl;
    if(f.type==='select'){
      inputEl = selectInput(obj[f.key], f.options, v=>{ obj[f.key]=v; }, 'Select...');
    } else if(f.type==='yesno'){
      inputEl = yesNo(obj[f.key], v=>{ obj[f.key]=v; });
    } else if(f.type==='date'){
      inputEl = dateInput(obj[f.key], v=>{ obj[f.key]=v; });
    } else if(f.type==='textarea'){
      inputEl = textareaInput(obj[f.key], v=>{ obj[f.key]=v; });
    } else if(f.type==='multiselect'){
      inputEl = chipMultiSelect(obj[f.key]||(obj[f.key]=[]), f.options, v=>{ obj[f.key]=v; });
    } else {
      inputEl = textInput(obj[f.key], v=>{ obj[f.key]=v; });
    }
    container.appendChild(field(f.label, inputEl, {help:f.help}));
    if(f.otherTrigger && obj[f.key]===f.otherTrigger){
      const otherKey = f.key+'Other';
      container.appendChild(field('Please specify', textInput(obj[otherKey], v=>{obj[otherKey]=v;}), {}));
    }
  });
}

/* Ensure a plan object has all nested sub-objects initialized */
function ensurePlanShape(p){
  p.eligibility = p.eligibility || {useCommon:'', rows:[]};
  p.calculation = p.calculation || {useCommon:''};
  p.calculation.guidelines = p.calculation.guidelines || [];
  p.performance = p.performance || {useCommon:''};
  p.performance.matrix = p.performance.matrix || [];
  p.compaRatio = p.compaRatio || {useCommon:''};
  p.compaRatio.matrix = p.compaRatio.matrix || [];
  p.budget = p.budget || {useCommon:''};
  p.approvals = p.approvals || {useCommon:'', levels:[]};
  p.payroll = p.payroll || {useCommon:''};
  p.generationPayment = p.generationPayment || {};
  p.proration = p.proration || {useCommon:''};
  p.managerWorksheetCfg = p.managerWorksheetCfg || {useCommon:''};
  p.payrollAuto = p.payrollAuto || {};
  p.individualComp = p.individualComp || {};
  p.employeeComm = p.employeeComm || {};
  return p;
}

function completedCount(){
  const vs = visibleSections();

}
function currentSectionId(){
  const vs = visibleSections();
  if(state.currentStep>=vs.length) state.currentStep=vs.length-1;
  if(state.currentStep<0) state.currentStep=0;
  return vs[state.currentStep] ? vs[state.currentStep].id : vs[0].id;
}

    container.appendChild(h('div',{class:'banner-info', text:'Please add at least one compensation plan before continuing.'}));
  } else {
    const wfcList = state.plans.filter(isWFC).map(p=>p.name||p.id);
    const payrollList = state.plans.filter(isPayrollClass).map(p=>p.name||p.id);
    const indivList = state.plans.filter(isIndivComp).map(p=>p.name||p.id);
    const unclassified = state.plans.filter(isUnclassified).map(p=>p.name||p.id);
    let summary = state.plans.length+' compensation plan(s) registered. ';
    summary += 'WFC: '+(wfcList.length?wfcList.join(', '):'none')+'. ';
    summary += 'Payroll: '+(payrollList.length?payrollList.join(', '):'none')+'. ';
    summary += 'Individual Comp: '+(indivList.length?indivList.join(', '):'none')+'.';
    container.appendChild(h('div',{class:'banner-info', text:summary}));
    if(unclassified.length){
      container.appendChild(h('div',{class:'banner-err', text:'Not yet classified: '+unclassified.join(', ')+'. Detail sections stay hidden for these until classified.'}));
    }
  }
  addSectionCommentBox(container, 'planRegister');
}
function validatePlanRegister(){
  const errs=[];
  if(state.plans.length===0) errs.push('Please add at least one compensation plan before continuing.');
  state.plans.forEach(p=>{
    if(!p.name) errs.push('Every plan must have a Plan Name (see '+p.id+').');
    if(!p.moduleClass) errs.push('Every plan must be classified (WFC / Payroll / Individual Comp) — see '+(p.name||p.id)+'.');
  });
  return errs;
}

/* ---- 5.3 Calendar ---- */
function calFieldsForm(calObj){
  const wrap = h('div',{});
  const row1 = h('div',{class:'row'});
  row1.appendChild(field('Calendar Name', textInput(calObj.name, v=>calObj.name=v)));
  row1.appendChild(field('Compensation Year', numberInput(calObj.year, v=>calObj.year=v)));
  wrap.appendChild(row1);
  const row2 = h('div',{class:'row'});
  const freqSel = selectInput(calObj.frequency, FREQUENCIES, v=>calObj.frequency=v, 'Select...');
  row2.appendChild(field('Cycle Frequency', freqSel));
  row2.appendChild(field('Compensation Cycle Type', selectInput(calObj.cycleType, CYCLE_TYPES, v=>calObj.cycleType=v, 'Select...')));
  wrap.appendChild(row2);
  if(calObj.frequency==='Other'){
    wrap.appendChild(field('Specify Frequency', textInput(calObj.frequencyOther, v=>calObj.frequencyOther=v)));
  }
  const row3 = h('div',{class:'row'});
  row3.appendChild(field('Cycle Start Date', dateInput(calObj.startDate, v=>calObj.startDate=v)));
  row3.appendChild(field('Cycle End Date', dateInput(calObj.endDate, v=>calObj.endDate=v)));
  wrap.appendChild(row3);
  wrap.appendChild(field('Compensation Effective Date', dateInput(calObj.effectiveDate, v=>calObj.effectiveDate=v), {help:'This may differ from the cycle start/end dates.'}));
  return wrap;
}

function renderCalendar(container){
  container.appendChild(sectionHeader('Compensation Calendar & Plan Scheduling','Now that your compensation plans are registered, define how their calendars are organized.'));

  if(state.plans.length===0){
    container.appendChild(h('div',{class:'banner-err', text:'Please register at least one compensation plan first.'}));
    return;
  }

  const approachCard = h('div',{class:'card'});
  approachCard.appendChild(h('h3',{text:'Calendar Approach'}));
  approachCard.appendChild(field('How are compensation calendars managed across the compensation plans?',
    selectInput(state.calendarApproach, ['One common calendar for all plans','Different calendar for each plan','Some plans share a calendar and others use separate calendars'],
      v=>{ state.calendarApproach = v==='One common calendar for all plans'?'1': v==='Different calendar for each plan'?'2':'3'; }, 'Select...')
  ));
  container.appendChild(approachCard);

  const approach = state.calendarApproach;

  if(approach==='1'){
    if(state.calendars.length===0){ state.calendars.push({id:nextCalId(), name:'', year:'', frequency:'', startDate:'', endDate:'', effectiveDate:'', cycleType:'', planIds:[]}); }
    const common = state.calendars[0];
    const card = h('div',{class:'card'});
    card.appendChild(h('h3',{text:'Common Compensation Calendar'}));
    card.appendChild(calFieldsForm(common));
    card.appendChild(field('Which compensation plans use this calendar?', chipMultiSelect(common.planIds.length?common.planIds:(common.planIds=state.plans.map(p=>p.id)), state.plans.map(p=>p.id), v=>common.planIds=v), {help:'Plan IDs shown; names: '+state.plans.map(p=>(p.id+' = '+(p.name||'—'))).join(', ')}));
    container.appendChild(card);

    const ovCard = h('div',{class:'card'});
    ovCard.appendChild(h('h3',{text:'Common Calendar Override'}));
    ovCard.appendChild(field('Does any compensation plan require a different calendar?', yesNo(state.calendarOverride.any, v=>state.calendarOverride.any=v)));
    if(state.calendarOverride.any==='Yes'){
      ovCard.appendChild(field('Select the plan requiring a different calendar', selectInput(state.calendarOverride.planId, state.plans.map(p=>p.id+' — '+(p.name||'Unnamed')), v=>state.calendarOverride.planId=v.split(' — ')[0], 'Select plan...')));
      if(state.calendarOverride.planId){
        if(!state.calendarOverride.calendar || !state.calendarOverride.calendar._init){
          state.calendarOverride.calendar = {id:nextCalId(), name:'', year:'', frequency:'', startDate:'', endDate:'', effectiveDate:'', cycleType:'', planIds:[state.calendarOverride.planId], _init:true};
        }
        ovCard.appendChild(calFieldsForm(state.calendarOverride.calendar));
      }
    }
    container.appendChild(ovCard);
  }

  if(approach==='2'){
    const card = h('div',{class:'card'});
    card.appendChild(h('h3',{text:'Plan Calendar Matrix'}));
    card.appendChild(h('div',{class:'helper-text', text:'Each plan must have its own calendar.'}));
    state.plans.forEach(p=>{
      let cal = state.calendars.find(c=>c.planIds.includes(p.id));
      if(!cal){ cal = {id:nextCalId(), name:'', year:'', frequency:p.frequency||'', startDate:'', endDate:'', effectiveDate:'', cycleType:'', planIds:[p.id]}; state.calendars.push(cal); }
      const sub = h('div',{class:'subcard'});
      sub.appendChild(h('h3',{text:p.name||p.id}));
      sub.appendChild(calFieldsForm(cal));
      card.appendChild(sub);
    });
    container.appendChild(card);
  }

  if(approach==='3'){
    const card = h('div',{class:'card'});
    card.appendChild(h('h3',{text:'Calendar Groups'}));
    state.calendars.forEach((cal, idx)=>{
      const sub = h('div',{class:'subcard'});
      const hd = h('div',{style:'display:flex;justify-content:space-between;align-items:center;'});
      hd.appendChild(h('h3',{text:cal.name || ('Calendar Group '+(idx+1))}));
      const del = h('button',{class:'btn-danger btn-sm', type:'button', text:'Remove Group'});
      del.addEventListener('click', ()=>{ state.calendars.splice(idx,1); persist(); render(); });
      hd.appendChild(del);
      sub.appendChild(hd);
      sub.appendChild(calFieldsForm(cal));
      sub.appendChild(field('Plans Using This Calendar', chipMultiSelect(cal.planIds, state.plans.map(p=>p.id), v=>cal.planIds=v)));
      card.appendChild(sub);
    });
    const addBtn = h('button',{class:'btn-secondary', type:'button', text:'+ Add Calendar Group'});
    addBtn.addEventListener('click', ()=>{
      state.calendars.push({id:nextCalId(), name:'', year:'', frequency:'', startDate:'', endDate:'', effectiveDate:'', cycleType:'', planIds:[]});
      persist(); render();
    });
    card.appendChild(addBtn);
    container.appendChild(card);
  }

  // Frequency inheritance mismatch warnings
  if(approach){
    const mismatches=[];
    state.plans.forEach(p=>{
      const cal = findCalendarForPlan(p.id);
      if(cal && cal.frequency && p.frequency && cal.frequency!==p.frequency) mismatches.push(p.name||p.id);
    });
    if(mismatches.length){
      container.appendChild(h('div',{class:'banner-info', text:'The calendar frequency differs from the frequency initially specified for: '+mismatches.join(', ')+'. Please confirm this is intentional.'}));
    }
  }

  // Plan-specific effective date confirmation
  if(approach){
    const effCard = h('div',{class:'card'});
    effCard.appendChild(h('h3',{text:'Plan-Specific Effective Dates'}));
    state.plans.forEach(p=>{
      const sub = h('div',{class:'subcard'});
      sub.appendChild(h('h3',{text:p.name||p.id}));
      sub.appendChild(field('Does this plan use the same effective date as the calendar?', yesNo(p.effectiveDateSame, v=>p.effectiveDateSame=v)));
      if(p.effectiveDateSame==='No'){
        sub.appendChild(field('Plan-specific effective date', dateInput(p.effectiveDate, v=>p.effectiveDate=v)));
      }
      effCard.appendChild(sub);
    });
    container.appendChild(effCard);
  }

  // Reopening
  const reopenCard = h('div',{class:'card'});
  reopenCard.appendChild(h('h3',{text:'Calendar Reopening'}));
  reopenCard.appendChild(field('Can a compensation cycle be reopened after completion?', yesNo(state.calendarReopen.allowed, v=>state.calendarReopen.allowed=v)));
  if(state.calendarReopen.allowed==='Yes'){
    reopenCard.appendChild(field('Who can reopen the cycle?', selectInput(state.calendarReopen.who, REOPEN_WHO, v=>state.calendarReopen.who=v, 'Select...')));
    if(state.calendarReopen.who==='Other') reopenCard.appendChild(field('Specify', textInput(state.calendarReopen.whoOther, v=>state.calendarReopen.whoOther=v)));
    reopenCard.appendChild(field('Under what circumstances?', textareaInput(state.calendarReopen.circumstances, v=>state.calendarReopen.circumstances=v)));
    reopenCard.appendChild(field('Is additional approval required?', yesNo(state.calendarReopen.additionalApproval, v=>state.calendarReopen.additionalApproval=v)));
  }
  container.appendChild(reopenCard);

  // Exceptions
  const excCard = h('div',{class:'card'});
  excCard.appendChild(h('h3',{text:'Calendar Exceptions'}));
  excCard.appendChild(field('Are there any planned exceptions to the compensation calendar?', yesNo(state.calendarExceptions.has, v=>state.calendarExceptions.has=v)));
  if(state.calendarExceptions.has==='Yes'){
    excCard.appendChild(renderMatrix(state.calendarExceptions.rows, [
      {key:'planCalendar', label:'Plan / Calendar', type:'text'},
      {key:'exceptionType', label:'Exception Type', type:'select', options:EXCEPTION_TYPES},
      {key:'originalDate', label:'Original Date', type:'date'},
      {key:'newDate', label:'New Date', type:'date'},
      {key:'reason', label:'Reason', type:'text'}
    ]));
  }
  container.appendChild(excCard);
  addSectionCommentBox(container, 'calendar');
}
function findCalendarForPlan(planId){
  return state.calendars.find(c=>c.planIds && c.planIds.includes(planId)) ||
    (state.calendarOverride.planId===planId ? state.calendarOverride.calendar : null);
}
function validateCalendar(){
  const errs=[];
  if(state.plans.length===0) return errs;
  if(!state.calendarApproach) errs.push('Please select a calendar approach.');
  state.plans.forEach(p=>{
    const cal = findCalendarForPlan(p.id);
    if(!cal) errs.push('Please assign a compensation calendar to every compensation plan before continuing ('+(p.name||p.id)+').');
  });
  if(state.calendarApproach==='3'){
    state.calendars.forEach(c=>{
      if(!c.planIds || c.planIds.length===0) errs.push('Please assign at least one compensation plan to calendar "'+(c.name||c.id)+'" or remove it.');
    });
  }
  return errs;
}

function planFilter(pred){ return state.plans.filter(pred); }

function planSectionWrapper(container, title, helper, plans, sectionKey, schema, opts={}){
  container.appendChild(sectionHeader(title, helper));
  if(plans.length===0){
    container.appendChild(h('div',{class:'empty-state'},[h('div',{class:'big',text:'—'}),h('div',{text:'No plans require this section.'})]));
    return;
  }
  plans.forEach(p=>{
    const cfg = p[sectionKey];
    const card = h('div',{class:'card'});
    card.appendChild(h('h3',{},[h('span',{class:'plan-chip'},[p.name||p.id, h('span',{class:'id',text:' '+p.id})]), h('span',{class:'tag', text:title})]));
    if(opts.commonAvailable !== false){
      card.appendChild(useCommonBox('Does this plan use the common '+opts.commonLabel+'?', cfg));
    }
    if(cfg.useCommon!=='Yes'){
      const formWrap = h('div',{});
      if(schema) renderSchemaForm(formWrap, cfg, schema);
      if(opts.extraRender) opts.extraRender(formWrap, p, cfg);
      card.appendChild(formWrap);
    } else {
      card.appendChild(h('div',{class:'helper-text', text:'Inheriting common configuration from Shared Requirements.'}));
    }
    container.appendChild(card);
  });
  addSectionCommentBox(container, sectionKey);
}

/* ---- 5.18 Review & Submit ---- */
function reviewItem(k,v){ return h('div',{class:'review-item'},[h('div',{class:'k',text:k}), h('div',{class:'v',text:(v===''||v===undefined||v===null)?'—':(Array.isArray(v)?v.join(', '):v)})]); }
function editBtn(sectionId){
  const b = h('button',{class:'btn-secondary btn-sm', type:'button', text:'Edit'});
  b.addEventListener('click', ()=>goToSectionId(sectionId));
  return b;
}
function renderReview(container){
  container.appendChild(sectionHeader('Review & Submit','Please review your answers before submitting. Click Edit on any section to make changes.'));

  const errs = allValidationErrors();
  if(errs.length){
    container.appendChild(h('div',{class:'banner-err'},[h('div',{text:'Please resolve the following before submitting:'}), h('ul',{style:'margin:6px 0 0 18px;'}, errs.map(e=>h('li',{text:e})))]));
  }

  // Common requirements
  const common = h('div',{class:'review-block'});
  const ch = h('h3',{},['Common Requirements', editBtn('respondent')]);
  ch.style.display='flex'; ch.style.justifyContent='space-between'; ch.style.alignItems='center';
  common.appendChild(ch);
  const grid = h('div',{class:'review-grid'});
  const r = state.respondent;
  grid.appendChild(reviewItem('Respondent', r.name));
  grid.appendChild(reviewItem('Position', r.position));
  grid.appendChild(reviewItem('Company', r.company));
  grid.appendChild(reviewItem('Email', r.email));
  grid.appendChild(reviewItem('Calendar Approach', {'1':'One common calendar','2':'Different calendar per plan','3':'Some plans share calendars'}[state.calendarApproach]||'—'));
  grid.appendChild(reviewItem('Currency (common)', state.shared.currency.same==='Yes'? state.shared.currency.value : 'Per plan'));
  grid.appendChild(reviewItem('Salary Source (common)', state.shared.salarySource.same==='Yes'? state.shared.salarySource.source : 'Per plan'));
  grid.appendChild(reviewItem('Performance Source (common)', state.shared.performance.same==='Yes'? state.shared.performance.source : (state.shared.performance.same==='No'?'Per plan':'N/A')));
  grid.appendChild(reviewItem('Final Processing', state.finalProcessingCommon.same==='Yes' ? state.finalProcessingCommon.by : 'Per plan'));
  grid.appendChild(reviewItem('Security', state.security.same==='Yes' ? (state.security.viewAccess||[]).join(', ') : 'Per plan'));
  common.appendChild(grid);
  container.appendChild(common);

  // Plan-specific
  const psHeader = h('h3',{text:'Plan-Specific Requirements'});
  container.appendChild(psHeader);
  state.plans.forEach(p=>{
    const cardWrap = h('div',{class:'plan-review-card'});
    const head = h('div',{class:'plan-review-head'},[
      h('div',{},[h('strong',{text:p.name||p.id}), h('span',{style:'opacity:.75;font-size:11px;margin-left:8px;', text:p.id})]),
      editBtn('planRegister')
    ]);
    cardWrap.appendChild(head);
    const body = h('div',{class:'plan-review-body'});

    function sub(title, sectionId, gridPairs){
      const s = h('div',{class:'sub-review'});
      s.appendChild(h('h4',{},[title, editBtn(sectionId)]));
      const g = h('div',{class:'review-grid'});
      gridPairs.forEach(([k,v])=>g.appendChild(reviewItem(k,v)));
      s.appendChild(g);
      body.appendChild(s);
    }

    sub('Basic Plan Info','planRegister',[
      ['Classification', p.moduleClass||'Not yet confirmed'],
      ['Compensation Type', p.compensationType==='Other'?p.compensationTypeOther:p.compensationType],
      ['Frequency', p.frequency==='Other'?p.frequencyOther:p.frequency],
      ['Performance Linked', p.performanceLinked],['Compa-Ratio Linked', p.compaRatioLinked],
      ['Budget Required', p.budgetRequired],['Approval Required', p.approvalRequired],
      ['Salary Update', p.salaryUpdate],['Payroll Impact', p.payrollImpact],
      ['Proration Required', p.prorationRequired],['Manager Worksheet', p.managerWorksheetReq]
    ]);
    if(isWFC(p)){
      const cal = findCalendarForPlan(p.id);
      sub('Calendar','calendar',[['Calendar', cal?(cal.name||cal.id):'Not assigned'],['Effective Date', p.effectiveDateSame==='No'?p.effectiveDate:(cal?cal.effectiveDate:'')]]);
      sub('Eligibility & Core HR','eligibility',[['Uses Common', p.eligibility.useCommon],['Rows Defined', (p.eligibility.rows||[]).length]]);
      sub('Calculation & Guidelines','calculation',[['Uses Common', p.calculation.useCommon],['Basis', p.calculation.basis],['Method', p.calculation.method]]);
      if(p.performanceLinked==='Yes') sub('Performance','performance',[['Uses Common', p.performance.useCommon],['Source', p.performance.source]]);
      if(p.compaRatioLinked==='Yes') sub('Compa-Ratio','compaRatio',[['Uses Common', p.compaRatio.useCommon],['Source', p.compaRatio.source]]);
      if(p.budgetRequired==='Yes') sub('Budget','budget',[['Uses Common', p.budget.useCommon],['Type', p.budget.type],['Level', p.budget.level]]);
      if(p.approvalRequired==='Yes') sub('Approvals','approvals',[['Uses Common', p.approvals.useCommon],['Levels Defined', (p.approvals.levels||[]).length],['Proxy Allowed', p.approvals.proxyAllowed]]);
      if(p.payrollImpact==='Yes'||p.salaryUpdate==='Yes') sub('Payroll & Salary Integration','payroll',[['Uses Common', p.payroll.useCommon],['Payroll Action', p.payroll.payrollAction],['Rollback Allowed', p.payroll.rollbackAllowed]]);
      sub('Generation & Payment','generationPayment',[['Method', p.generationPayment.method],['Payment Type', p.generationPayment.paymentType]]);
      if(p.prorationRequired==='Yes') sub('Proration','proration',[['Uses Common', p.proration.useCommon],['Method', p.proration.method]]);
      if(p.managerWorksheetReq==='Yes') sub('Manager Worksheet','managerWorksheet',[['Uses Common', p.managerWorksheetCfg.useCommon]]);
    }
    if(isPayrollClass(p)){
      sub('Payroll-Classified Details','payrollAutoDetails',[
        ['Zero Manual Step?', p.payrollAuto.zeroManualStep],
        ['Data Source', p.payrollAuto.dataSource],
        ['Frequency', p.payrollAuto.frequency],
        ['Payroll Element', p.payrollAuto.payrollElement]
      ]);
    }
    if(isIndivComp(p)){
      sub('Individual Compensation Details','individualCompDetails',[
        ['Trigger', p.individualComp.trigger],
        ['Approver', p.individualComp.approverRole],
        ['Budget Cap?', p.individualComp.budgetCap],
        ['Effect', p.individualComp.effectType]
      ]);
    }

    cardWrap.appendChild(body);
    container.appendChild(cardWrap);
  });

  // Other requirements
  if(state.otherRequirements.length || state.otherText){
    const o = h('div',{class:'review-block'});
    o.appendChild(h('h3',{},['Other Requirements', editBtn('other')]));
    if(state.otherText) o.appendChild(h('p',{text:state.otherText}));
    o.appendChild(h('div',{text:(state.otherRequirements.length)+' additional requirement row(s) captured.'}));
    container.appendChild(o);
  }

  // Export + Submit
  const actionsCard = h('div',{class:'card'});
  actionsCard.appendChild(h('h3',{text:'Export & Submit'}));
  const btnRow = h('div',{style:'display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;'});
  const exportJsonBtn = h('button',{class:'btn-secondary', type:'button', text:'⬇ Export JSON'});
  exportJsonBtn.addEventListener('click', exportJSON);
  const exportCsvBtn = h('button',{class:'btn-secondary', type:'button', text:'⬇ Export CSV'});
  exportCsvBtn.addEventListener('click', exportCSV);
  btnRow.appendChild(exportJsonBtn); btnRow.appendChild(exportCsvBtn);
  actionsCard.appendChild(btnRow);

  const submitBtn = h('button',{class:'btn-primary btn-block', type:'button', text:'Submit Questionnaire'});
  submitBtn.disabled = errs.length>0;
  submitBtn.addEventListener('click', submitQuestionnaire);
  actionsCard.appendChild(submitBtn);
  container.appendChild(actionsCard);
}

/* ---------------------------------------------------------
   6. VALIDATION AGGREGATION
--------------------------------------------------------- */
function allValidationErrors(){
  let errs=[];
  SECTIONS.forEach(s=>{
    if(s.id==='review') return;
    if(s.always || (s.visible && s.visible(state))){
      errs = errs.concat(s.validate(state));
    }
  });
  return [...new Set(errs)];
}

--------------------------------------------------------- */
function downloadBlob(content, filename, type){
  const blob = new Blob([content], {type});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}
function exportJSON(){
  const payload = {
    common: {
      respondent: state.respondent,
      calendarApproach: state.calendarApproach,
      calendars: state.calendars,
      calendarReopen: state.calendarReopen,
      calendarExceptions: state.calendarExceptions,
      sharedRequirements: state.shared,
      finalProcessingCommon: state.finalProcessingCommon,
      security: state.security,
      reportingCommon: state.reportingCommon,
      communication: state.communication,
      otherRequirements: state.otherRequirements,
      otherText: state.otherText
    },
    planSpecific: state.plans
  };
  downloadBlob(JSON.stringify(payload, null, 2), 'WFC_Questionnaire_Responses.json', 'application/json');
  showToast('JSON exported');
}
function csvEscape(v){
  if(v===undefined||v===null) v='';
  v = String(v).replace(/"/g,'""');
  return '"'+v+'"';
}
function exportCSV(){
  const rows = [['Section','Plan','Field','Value']];
  rows.push(['Respondent','', 'Name', state.respondent.name]);
  rows.push(['Respondent','', 'Email', state.respondent.email]);
  rows.push(['Respondent','', 'Company', state.respondent.company]);
  state.plans.forEach(p=>{
    const flat = {
      'Classification':p.moduleClass, 'Compensation Type':p.compensationType, 'Frequency':p.frequency, 'Performance Linked':p.performanceLinked,
      'Compa-Ratio Linked':p.compaRatioLinked, 'Budget Required':p.budgetRequired, 'Approval Required':p.approvalRequired,
      'Salary Update':p.salaryUpdate, 'Payroll Impact':p.payrollImpact, 'Proration Required':p.prorationRequired,
      'Manager Worksheet':p.managerWorksheetReq
    };
    Object.keys(flat).forEach(k=> rows.push(['Plan Register', p.name||p.id, k, flat[k]]));
  });
  const csv = rows.map(r=>r.map(csvEscape).join(',')).join('\n');
  downloadBlob(csv, 'WFC_Questionnaire_Responses.csv', 'text/csv');
  showToast('CSV exported');
}

   8. SUBMIT
--------------------------------------------------------- */
function submitQuestionnaire(){
  const errs = allValidationErrors();
  if(errs.length){ showToast('Please resolve validation errors first'); return; }
  state.submitted = true;
  state.submissionRef = 'WFC-2026-' + Math.floor(10000+Math.random()*89999);
  state.submissionDate = new Date().toISOString().slice(0,10);
  persist();
  render();
}

function render(){
  const app = document.getElementById('app');
  app.innerHTML='';

  if(state.submitted){
    app.appendChild(renderSuccessScreen());
    return;
  }

  const vs = visibleSections();
  const curId = currentSectionId();
  const curIdx = vs.findIndex(s=>s.id===curId);
  const section = vs[curIdx];

  // Header
  const header = h('header',{class:'app-header'});
  const brand = h('div',{class:'brand'});
  const hamb = h('button',{class:'hamburger', type:'button', text:'☰'});
  hamb.addEventListener('click', ()=>{
    mobileNavOpen = !mobileNavOpen;
    render();
  });
  brand.appendChild(hamb);
  brand.appendChild(logoSVG());
  brand.appendChild(h('div',{class:'brand-text'},[h('h1',{text:'Workforce Compensation — Requirements Questionnaire'}),h('p',{text:'Oracle Fusion HCM Cloud Implementation'})]));
  header.appendChild(brand);
  const hActions = h('div',{class:'header-actions'});
  const saveBtn = h('button',{class:'btn-ghost btn-sm', type:'button', text:'Save Draft'});
  saveBtn.addEventListener('click', ()=>{ persist(); showToast('Draft saved'); });
  const resetBtn = h('button',{class:'btn-ghost btn-sm', type:'button', text:'Start Over'});
  resetBtn.addEventListener('click', ()=>{
    if(confirm('This clears all responses on this device. Continue?')){
      localStorage.removeItem(STORAGE_KEY); state = freshState(); render();
    }
  });
  hActions.appendChild(saveBtn); hActions.appendChild(resetBtn);
  header.appendChild(hActions);
  app.appendChild(header);

  // Progress
  const pct = vs.length ? Math.round(((curIdx)/(vs.length-1||1))*100) : 0;
  const progWrap = h('div',{class:'progress-wrap'});
  progWrap.appendChild(h('div',{class:'progress-bar-track'},[h('div',{class:'progress-bar-fill', style:'width:'+pct+'%'})]));
  progWrap.appendChild(h('div',{class:'progress-label'},[h('span',{text:'Step '+(curIdx+1)+' of '+vs.length+': '+section.title}), h('span',{text:pct+'% complete'})]));
  app.appendChild(progWrap);

  // Layout
  const layout = h('div',{class:'layout'});
  const nav = h('nav',{class:'side-nav'+(mobileNavOpen?' mobile-open':''), id:'sideNav'});
  let lastGroup=null;
  vs.forEach((s, idx)=>{
    if(s.group!==lastGroup){
      nav.appendChild(h('div',{style:'padding:10px 18px 4px;font-size:10.5px;font-weight:700;color:#9aa1bd;text-transform:uppercase;letter-spacing:.5px;', text:s.group}));
      lastGroup=s.group;
    }
    const item = h('div',{class:'nav-item'+(idx===curIdx?' active':'')+(idx<curIdx?' done':'')});
    item.appendChild(h('div',{class:'nav-dot'}));
    item.appendChild(h('div',{text:s.title}));
    item.addEventListener('click', ()=>{ state.currentStep=idx; mobileNavOpen=false; render(); });
    nav.appendChild(item);
  });
  layout.appendChild(nav);

  const main = h('main',{class:'content'});
  const inner = h('div',{class:'content-inner'});
  section.render(inner);
  main.appendChild(inner);
  layout.appendChild(main);
  app.appendChild(layout);

  // Footer
  const footer = h('footer',{class:'wizard-footer'});
  const backBtn = h('button',{class:'btn-secondary', type:'button', text:'← Back'});
  backBtn.disabled = curIdx===0;
  backBtn.addEventListener('click', ()=>{ state.currentStep=Math.max(0,curIdx-1); render(); });
  footer.appendChild(backBtn);

  footer.appendChild(h('div',{class:'save-indicator'},[h('div',{class:'dot'}), h('span',{text:'Auto-saved locally'})]));

  const rightWrap = h('div',{class:'footer-right'});
  if(section.id!=='review'){
    const nextBtn = h('button',{class:'btn-primary', type:'button', text: idx_isLast(curIdx,vs)?'Go to Review →':'Next →'});
    nextBtn.addEventListener('click', ()=>{
      const errs = section.validate(state);
      if(errs.length){
        showToast(errs[0]);
        renderInlineErrors(inner, errs);
        return;
      }
      persist();
      if(idx_isLast(curIdx,vs)){
        goToSectionId('review');
      } else {
        state.currentStep = curIdx+1; render();
      }
    });
    rightWrap.appendChild(nextBtn);
  }
  footer.appendChild(rightWrap);
  app.appendChild(footer);
}
function idx_isLast(curIdx, vs){ return curIdx>=vs.length-2 && vs[vs.length-1].id==='review'; }
function renderInlineErrors(container, errs){
  const existing = container.querySelector('.banner-err.inline-val');
  if(existing) existing.remove();
  const banner = h('div',{class:'banner-err inline-val'},[h('div',{text:'Please resolve the following:'}), h('ul',{style:'margin:6px 0 0 18px;'}, errs.map(e=>h('li',{text:e})))]);
  container.insertBefore(banner, container.firstChild.nextSibling);
}

function renderSuccessScreen(){
  const wrap = h('div',{});
  const header = h('header',{class:'app-header'});
  const brand = h('div',{class:'brand'});
  brand.appendChild(logoSVG());
  brand.appendChild(h('div',{class:'brand-text'},[h('h1',{text:'Workforce Compensation — Requirements Questionnaire'}),h('p',{text:'Oracle Fusion HCM Cloud Implementation'})]));
  header.appendChild(brand);
  wrap.appendChild(header);

  const main = h('main',{class:'content'});
  const success = h('div',{class:'success-wrap'});
  success.appendChild(h('div',{class:'check', text:'✓'}));
  success.appendChild(h('h2',{style:'color:var(--navy);margin:0 0 8px;', text:'Thank you.'}));
  success.appendChild(h('p',{style:'color:var(--text-mut);', text:'Your Workforce Compensation implementation questionnaire has been submitted successfully.'}));
  const refBox = h('div',{class:'ref-box'});
  refBox.appendChild(h('div',{style:'font-size:11px;color:var(--text-mut);text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px;', text:'Submission Reference'}));
  refBox.appendChild(h('div',{class:'ref-code', text:state.submissionRef}));
  const grid = h('div',{class:'review-grid', style:'margin-top:14px;'});
  grid.appendChild(reviewItem('Respondent', state.respondent.name));
  grid.appendChild(reviewItem('Position', state.respondent.position));
  grid.appendChild(reviewItem('Company', state.respondent.company));
  grid.appendChild(reviewItem('Submission Date', state.submissionDate));
  refBox.appendChild(grid);
  success.appendChild(refBox);

  const btnRow = h('div',{style:'display:flex;gap:10px;justify-content:center;flex-wrap:wrap;'});
  const dlBtn = h('button',{class:'btn-primary', type:'button', text:'⬇ Download Responses (JSON)'});
  dlBtn.addEventListener('click', exportJSON);
  const dlCsv = h('button',{class:'btn-secondary', type:'button', text:'⬇ Download Responses (CSV)'});
  dlCsv.addEventListener('click', exportCSV);
  const editBtn2 = h('button',{class:'btn-secondary', type:'button', text:'Edit Responses'});
  editBtn2.addEventListener('click', ()=>{ state.submitted=false; goToSectionId('review'); });
  btnRow.appendChild(dlBtn); btnRow.appendChild(dlCsv); btnRow.appendChild(editBtn2);
  success.appendChild(btnRow);

  main.appendChild(success);
  wrap.appendChild(main);
  return wrap;
}

/* ---------------------------------------------------------
   10. INIT
--------------------------------------------------------- */
render();
</script>
